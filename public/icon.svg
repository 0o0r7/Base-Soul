<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0a0f"/>
  
  <!-- Outer glow -->
  <circle cx="256" cy="256" r="220" fill="url(#orbGlow)" opacity="0.5"/>
  
  <!-- Main orb -->
  <circle cx="256" cy="256" r="160" fill="url(#orbGlow)"/>
  
  <!-- Inner highlight -->
  <circle cx="256" cy="256" r="140" fill="url(#innerGlow)"/>
  
  <!-- Core light -->
  <circle cx="220" cy="220" r="40" fill="white" opacity="0.2"/>
</svg>


