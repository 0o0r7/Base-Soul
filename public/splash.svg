<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <radialGradient id="orbGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </radialGradient>
    <radialGradient id="innerHighlight" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  
  <!-- Ambient glow -->
  <ellipse cx="600" cy="250" rx="200" ry="200" fill="#8B5CF6" opacity="0.15" filter="blur(60px)"/>
  
  <!-- Main orb -->
  <circle cx="600" cy="250" r="100" fill="url(#orbGradient)"/>
  
  <!-- Inner highlight -->
  <circle cx="600" cy="250" r="90" fill="url(#innerHighlight)"/>
  
  <!-- Core light -->
  <circle cx="570" cy="220" r="25" fill="white" opacity="0.3"/>
  
  <!-- Text: Base Soul -->
  <text x="600" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">Base Soul</text>
  
  <!-- Tagline -->
  <text x="600" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.5)" text-anchor="middle">Discover Your Digital Soul</text>
</svg>


